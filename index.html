<!DOCTYPE html>
<html lang="mk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Манастирски ресторан Лешок</title>
<meta name="description" content="Мени – Манастирски ресторан Лешок, манастир Св. Атанасиј, Лешок, Тетово.">
<meta name="theme-color" content="#16261c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3a28'/%3E%3Cpath d='M32 10v8M28 14h8M20 54V34a12 12 0 0 1 24 0v20' fill='none' stroke='%23c9a45c' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      var t = localStorage.getItem("lesok-theme");
      if (t === "light") document.documentElement.setAttribute("data-theme", "light");
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #f6f1e6;
    --paper: #fbf8f1;
    --ink: #1c231d;
    --muted: #5f655b;
    --faint: #8d8a7c;
    --rule: #d9cfb9;
    --forest: #1f3a28;
    --forest-ink: #efe6d2;
    --brass: #9b7633;
    --brass-soft: #c9a45c;
    --img-bg: #e4dcc8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1310; --paper: #121a15; --ink: #ece6d7; --muted: #aaa694; --faint: #7e7b6c;
      --rule: #2a332c; --forest: #16261c; --forest-ink: #ece6d7; --brass: #c9a45c; --brass-soft: #c9a45c;
      --img-bg: #1d251f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1310; --paper: #121a15; --ink: #ece6d7; --muted: #aaa694; --faint: #7e7b6c;
    --rule: #2a332c; --forest: #16261c; --forest-ink: #ece6d7; --brass: #c9a45c; --brass-soft: #c9a45c;
    --img-bg: #1d251f;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; -webkit-text-size-adjust: 100%; scrollbar-width: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; }
  dialog { scrollbar-width: none; }
  dialog::-webkit-scrollbar { display: none; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.55;
    transition: background-color .3s, color .3s;
  }
  .serif { font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; }
  h1, h2, h3 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; margin: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  .caps { text-transform: uppercase; letter-spacing: .24em; font-size: 11px; font-weight: 600; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; background: var(--forest); color: var(--forest-ink);
    text-align: center; padding: calc(54px + env(safe-area-inset-top)) 16px 0; overflow: hidden;
  }
  .controls { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 16px; }
  .lang {
    display: inline-flex; align-items: center; gap: 14px; color: var(--forest-ink);
    margin: 4px auto 0; padding: 6px 18px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--brass-soft) 45%, transparent);
  }
  .lang button { opacity: .5; padding: 4px 2px; letter-spacing: .2em; font-size: 12px; font-weight: 600; border-bottom: 1px solid transparent; }
  .lang button[aria-pressed="true"] { opacity: 1; border-bottom-color: var(--brass-soft); }
  .lang span { width: 1px; height: 12px; background: currentColor; opacity: .35; }
  .theme { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%;
    border: 1px solid color-mix(in srgb, var(--forest-ink) 25%, transparent); color: var(--forest-ink); }
  .theme svg { width: 17px; height: 17px; }
  .theme .sun { display: none; }
  :root[data-theme="dark"] .theme .sun { display: block; }
  :root[data-theme="dark"] .theme .moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme .sun { display: block; }
    :root:not([data-theme="light"]) .theme .moon { display: none; }
  }
  .crest { width: 52px; height: 52px; color: var(--brass-soft); margin: 0 auto 14px; display: block; }
  .hero .caps { color: var(--brass-soft); }
  .hero h1 { font-size: clamp(38px, 9vw, 64px); line-height: 1; font-weight: 500; margin: 12px auto 16px; max-width: 12ch; }
  .hero h1 em { font-style: italic; display: block; font-size: .62em; margin-top: 8px; opacity: .9; }
  .mountains { display: block; width: 100%; max-width: 900px; height: 56px; margin: 18px auto 0; color: var(--brass-soft); opacity: .7; }
  .hero-foot { height: 26px; background: var(--bg); border-radius: 26px 26px 0 0; margin: 0 -16px; position: relative; top: 1px; }

  /* ---------- Category nav ---------- */
  .catnav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
  }
  .catnav ul {
    list-style: none; margin: 0 auto; padding: 0 16px; max-width: 960px;
    display: flex; gap: 26px; overflow-x: auto; scrollbar-width: none;
  }
  .catnav ul::-webkit-scrollbar { display: none; }
  .catnav a {
    display: block; padding: 16px 0 14px; white-space: nowrap; text-decoration: none;
    color: var(--faint); border-bottom: 1px solid transparent; transition: color .2s, border-color .2s;
  }
  .catnav a.active { color: var(--ink); border-bottom-color: var(--brass); }
  .catnav .wrap { position: relative; max-width: 960px; margin: 0 auto; }

  /* Swipe hint – shown for a few seconds when the bar overflows */
  .swipe-hint {
    position: absolute; top: 0; right: 0; bottom: 0; width: 120px; pointer-events: none;
    display: flex; align-items: center; justify-content: flex-end; padding-right: 12px;
    background: linear-gradient(90deg, transparent, var(--bg) 60%);
    color: var(--brass); opacity: 0; transition: opacity .5s ease;
  }
  .swipe-hint.show { opacity: 1; }
  .swipe-hint svg { width: 40px; height: 40px; animation: swipe 1.4s ease-in-out infinite; }
  @keyframes swipe { 0%, 100% { transform: translateX(6px); opacity: .55; } 50% { transform: translateX(-16px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .swipe-hint svg { animation: none; } }

  @media (max-width: 600px) {
    .hero-foot { height: 34px; }
    .catnav { padding-top: env(safe-area-inset-top); }
    .catnav a { padding: 22px 0 16px; }
  }

  /* ---------- Menu ---------- */
  main { max-width: 960px; margin: 0 auto; padding: 0 16px 56px; }
  section.cat { padding-top: 56px; }
  .cat-head { text-align: center; margin-bottom: 30px; }
  .cat-head .num { color: var(--brass); font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 18px; }
  .cat-head h2 { font-size: clamp(32px, 7vw, 44px); font-weight: 500; line-height: 1.1; margin: 2px 0 12px; }
  .ornament { display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--brass); }
  .ornament::before, .ornament::after { content: ""; width: 56px; height: 1px; background: currentColor; opacity: .5; }
  .ornament svg { width: 14px; height: 14px; }

  .list { display: grid; grid-template-columns: 1fr; column-gap: 56px; }
  @media (min-width: 820px) { .list { grid-template-columns: 1fr 1fr; } }

  .dish {
    display: grid; grid-template-columns: 92px 1fr; gap: 18px; align-items: start;
    padding: 18px 0; border-bottom: 1px solid var(--rule); text-align: left; width: 100%;
    opacity: 0; transform: translateY(10px); transition: opacity .6s ease, transform .6s ease;
  }
  .dish.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .dish { opacity: 1; transform: none; transition: none; } }
  @media (min-width: 560px) { .dish { grid-template-columns: 112px 1fr; gap: 22px; } }

  .arch {
    position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--img-bg);
    border-radius: 999px 999px 6px 6px;
    box-shadow: 0 0 0 1px var(--rule), 0 0 0 4px var(--bg), 0 0 0 5px color-mix(in srgb, var(--brass) 45%, transparent);
    margin: 5px;
  }
  .arch img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s ease; }
  .dish:hover .arch img { transform: scale(1.06); }

  .info { min-width: 0; padding-top: 6px; }
  .line { display: flex; align-items: baseline; gap: 8px; }
  .line h3 { font-size: 22px; line-height: 1.2; font-weight: 600; }
  .leader { flex: 1; min-width: 16px; border-bottom: 1px dotted var(--faint); transform: translateY(-5px); opacity: .7; }
  .price { font-family: "Cormorant Garamond", serif; font-size: 21px; font-weight: 600; color: var(--brass); white-space: nowrap; font-variant-numeric: lining-nums; }
  .price small { font-family: "Manrope", sans-serif; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; margin-left: 3px; color: var(--faint); font-weight: 600; }
  .desc { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 17px; line-height: 1.4; color: var(--muted); margin: 4px 0 0; }
  .marks { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; color: var(--brass); }
  .marks span { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; }
  .marks svg { width: 12px; height: 12px; }

  .legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 22px; color: var(--brass); margin-top: 30px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; }
  .legend svg { width: 12px; height: 12px; }

  /* ---------- Dish detail ---------- */
  dialog {
    border: 0; padding: 0; width: min(520px, calc(100% - 32px)); max-height: calc(100% - 32px);
    background: var(--paper); color: var(--ink); border-radius: 20px; overflow: auto;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .35);
  }
  dialog::backdrop { background: rgba(10, 16, 12, .6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  dialog[open] { animation: rise .35s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
  .d-img { aspect-ratio: 4 / 3; background: var(--img-bg); }
  .d-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .d-body { padding: 22px 24px 26px; text-align: center; }
  .d-body .caps { color: var(--brass); }
  .d-body h3 { font-size: 32px; font-weight: 500; line-height: 1.1; margin: 8px 0 10px; }
  .d-body .desc { font-size: 19px; margin: 12px 0 14px; }
  .d-body .price { font-size: 26px; }
  .d-body .marks { justify-content: center; }
  .close {
    position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%;
    background: rgba(0, 0, 0, .45); color: #fff; display: grid; place-items: center;
  }
  .close svg { width: 16px; height: 16px; }

  /* ---------- Footer ---------- */
  footer { background: var(--forest); color: var(--forest-ink); text-align: center; padding: 48px 16px calc(40px + env(safe-area-inset-bottom)); }
  footer .crest { width: 40px; height: 40px; margin-bottom: 14px; }
  footer h3 { font-size: 28px; font-weight: 500; }
  footer p { margin: 6px 0; opacity: .75; font-size: 14px; }
  footer a { color: var(--brass-soft); text-decoration: none; letter-spacing: .08em; }
  footer .small { font-size: 11.5px; opacity: .55; margin-top: 22px; }
  @media (max-width: 600px) {
    footer { padding: 24px 16px calc(18px + env(safe-area-inset-bottom)); }
    footer .crest { display: none; }
    footer h3 { font-size: 21px; }
    footer p { font-size: 12.5px; margin: 3px 0; }
    footer .small { font-size: 10.5px; margin-top: 12px; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="controls">
    <button type="button" class="theme" id="themeBtn" aria-label="Dark / light mode">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <svg class="crest" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
    <circle cx="32" cy="32" r="30" opacity=".5"/>
    <path d="M32 9v9M28 13h8"/>
    <path d="M22 50V32a10 10 0 0 1 20 0v18"/>
    <path d="M27 50V36a5 5 0 0 1 10 0v14"/>
    <path d="M16 50h32"/>
  </svg>
  <div class="caps" data-i18n="eyebrow"></div>
  <h1><span data-i18n="title1"></span><em data-i18n="title2"></em></h1>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="mk" aria-pressed="true">МК</button>
    <span></span>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <svg class="mountains" viewBox="0 0 900 80" fill="none" stroke="currentColor" stroke-width="1" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <path d="M0 78 L110 40 L170 58 L280 14 L360 46 L420 30 L520 62 L610 22 L700 50 L780 34 L900 70"/>
    <path d="M260 22 l20-8 14 12M590 30 l20-8 16 14" opacity=".6"/>
    <path d="M60 78 l8-14 8 14M74 78 l6-10 6 10M820 78 l8-14 8 14M836 78 l6-10 6 10" opacity=".8"/>
  </svg>
  <div class="hero-foot"></div>
</header>

<nav class="catnav caps" aria-label="Menu categories">
  <div class="wrap">
    <ul id="catnav"></ul>
    <div class="swipe-hint" id="swipeHint" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1a1.5 1.5 0 0 1 3 0v1.5m0-.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-1.2a5 5 0 0 1-3.9-1.9L4.6 15a1.5 1.5 0 0 1 2.3-1.9L9 15"/>
        <path d="M3 4h4M3 4l1.5-1.5M3 4l1.5 1.5"/>
      </svg>
    </div>
  </div>
</nav>

<main>
  <div class="legend" id="legend"></div>
  <div id="menu"></div>
</main>

<footer>
  <svg class="crest" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
    <path d="M32 9v9M28 13h8"/><path d="M22 50V32a10 10 0 0 1 20 0v18"/><path d="M16 50h32"/>
  </svg>
  <h3 data-i18n="title"></h3>
  <p data-i18n="address"></p>
  <p><a href="tel:+38944382666">+389 44 382 666</a></p>
  <p class="small" data-i18n="prices"></p>
  <p class="small" style="margin-top:4px" data-i18n="credits"></p>
</footer>

<dialog id="detail" aria-labelledby="d-name">
  <button type="button" class="close" id="d-close" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="d-img"><img id="d-img" alt=""></div>
  <div class="d-body">
    <div class="caps" id="d-cat"></div>
    <h3 id="d-name"></h3>
    <div class="ornament"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></svg></div>
    <p class="desc" id="d-desc"></p>
    <div class="price" id="d-price"></div>
    <div class="marks" id="d-marks"></div>
  </div>
</dialog>

<script src="menu.js"></script>
<script>
(function () {
  var T = {
    mk: {
      eyebrow: "Манастир Св. Атанасиј · Лешок",
      title: "Манастирски ресторан Лешок",
      title1: "Манастирски ресторан", title2: "Лешок",
      subtitle: "Традиционална македонска кујна во прегратката на природата, во подножјето на Шар Планина.",
      address: "с. Лешок, Тетово, Северна Македонија",
      prices: "Цените се во денари (МКД) и го вклучуваат ДДВ.",
      credits: "Фотографии: Wikimedia Commons (CC BY-SA) · илустративни.",
      house: "Специјалитет", veg: "Вегетаријанско", fast: "Посно", den: "ден"
    },
    en: {
      eyebrow: "St. Athanasius Monastery · Lešok",
      title: "Lešok Monastery Restaurant",
      title1: "Monastery Restaurant", title2: "Lešok",
      subtitle: "Traditional Macedonian cuisine in the embrace of nature, at the foot of the Šar Mountains.",
      address: "Lešok village, Tetovo, North Macedonia",
      prices: "Prices are in Macedonian denars (MKD), VAT included.",
      credits: "Photos: Wikimedia Commons (CC BY-SA) · illustrative.",
      house: "Specialty", veg: "Vegetarian", fast: "Fasting", den: "MKD"
    }
  };

  var ICON = {
    house: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></svg>',
    veg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 19l7-7"/></svg>',
    fast: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M7 8h10M9 16l6-2"/></svg>'
  };
  var ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];

  window.PLACEHOLDER_SRC = "data:image/svg+xml," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="#d9d0ba"/>' +
    '<path d="M0 380 L110 290 L190 350 L290 250 L400 340 V500 H0Z" fill="#a9b393"/>' +
    '<path d="M0 430 Q130 390 230 420 T400 410 V500 H0Z" fill="#5f7556"/></svg>');

  var lang = "mk";
  try {
    var q = new URLSearchParams(location.search).get("lang");
    var saved = localStorage.getItem("lesok-lang");
    if (q === "en" || q === "mk") lang = q; else if (saved === "en" || saved === "mk") lang = saved;
  } catch (e) {}

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(n) { return n.toLocaleString(lang === "mk" ? "mk-MK" : "en-US"); }
  function priceHTML(n) { return fmt(n) + "<small>" + T[lang].den + "</small>"; }
  function marksHTML(tags) {
    return (tags || []).map(function (k) { return "<span>" + ICON[k] + T[lang][k] + "</span>"; }).join("");
  }

  function render() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t[el.dataset.i18n]; });
    document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });

    document.getElementById("legend").innerHTML = marksHTML(["house", "veg", "fast"]);

    document.getElementById("catnav").innerHTML = window.MENU.map(function (c) {
      return '<li><a href="#' + c.id + '" data-cat="' + c.id + '">' + esc(c[lang]) + "</a></li>";
    }).join("");

    document.getElementById("menu").innerHTML = window.MENU.map(function (c, ci) {
      return '<section class="cat" id="' + c.id + '">' +
        '<div class="cat-head"><div class="num">' + ROMAN[ci] + '</div><h2>' + esc(c[lang]) + '</h2>' +
        '<div class="ornament">' + ICON.house + '</div></div><div class="list">' +
        c.items.map(function (d, di) {
          var L = d[lang];
          return '<button type="button" class="dish" data-c="' + ci + '" data-d="' + di + '">' +
            '<div class="arch"><img src="images/' + esc(d.img) + '" alt="' + esc(L.n) + '" loading="lazy" decoding="async" onerror="this.onerror=null;this.src=PLACEHOLDER_SRC"></div>' +
            '<div class="info"><div class="line"><h3>' + esc(L.n) + '</h3><span class="leader"></span><span class="price">' + priceHTML(d.price) + '</span></div>' +
            '<p class="desc">' + esc(L.d) + '</p>' +
            ((d.tags || []).length ? '<div class="marks">' + marksHTML(d.tags) + '</div>' : '') +
            '</div></button>';
        }).join("") + "</div></section>";
    }).join("");

    observe();
  }

  // Reveal on scroll + active category
  var navIO, revealIO;
  function observe() {
    var dishes = document.querySelectorAll(".dish");
    if (!("IntersectionObserver" in window)) { dishes.forEach(function (d) { d.classList.add("in"); }); return; }
    if (navIO) navIO.disconnect();
    if (revealIO) revealIO.disconnect();
    revealIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); revealIO.unobserve(e.target); } });
    }, { rootMargin: "0px 0px -6% 0px" });
    dishes.forEach(function (d) { revealIO.observe(d); });

    navIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        document.querySelectorAll(".catnav a").forEach(function (a) {
          var on = a.dataset.cat === e.target.id;
          a.classList.toggle("active", on);
          if (on) a.closest("ul").scrollTo({ left: a.offsetLeft - 16, behavior: "smooth" });
        });
      });
    }, { rootMargin: "-70px 0px -70% 0px" });
    document.querySelectorAll("section.cat").forEach(function (s) { navIO.observe(s); });
  }

  // Dish detail
  var dlg = document.getElementById("detail");
  document.getElementById("menu").addEventListener("click", function (e) {
    var b = e.target.closest(".dish");
    if (!b) return;
    var c = window.MENU[b.dataset.c], d = c.items[b.dataset.d], L = d[lang];
    var img = document.getElementById("d-img");
    img.onerror = function () { img.onerror = null; img.src = window.PLACEHOLDER_SRC; };
    img.src = "images/" + d.img; img.alt = L.n;
    document.getElementById("d-cat").textContent = c[lang];
    document.getElementById("d-name").textContent = L.n;
    document.getElementById("d-desc").textContent = L.d;
    document.getElementById("d-price").innerHTML = priceHTML(d.price);
    document.getElementById("d-marks").innerHTML = marksHTML(d.tags);
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  });
  document.getElementById("d-close").addEventListener("click", function () { dlg.close ? dlg.close() : dlg.removeAttribute("open"); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });

  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.dataset.lang;
      try { localStorage.setItem("lesok-lang", lang); } catch (e) {}
      render();
    });
  });

  document.getElementById("themeBtn").addEventListener("click", function () {
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme") ||
      (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("lesok-theme", next); } catch (e) {}
  });

  render();

  // Briefly hint that the category bar can be swiped
  (function () {
    var ul = document.getElementById("catnav"), hint = document.getElementById("swipeHint");
    if (ul.scrollWidth <= ul.clientWidth + 4) return;
    var timer;
    function hide() { hint.classList.remove("show"); clearTimeout(timer); ul.removeEventListener("scroll", hide); }
    setTimeout(function () {
      hint.classList.add("show");
      ul.addEventListener("scroll", hide, { passive: true });
      timer = setTimeout(hide, 8000);
    }, 600);
  })();
})();
</script>
</body>
</html>
